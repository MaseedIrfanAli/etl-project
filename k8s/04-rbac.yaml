apiVersion: v1
kind: ServiceAccount
metadata:
  name: etl-job-sa
  namespace: etl
---
# Deliberately minimal: this job doesn't need to talk to the Kubernetes API
# at all, so it gets no Role bindings. Documented here as a reminder that
# the default ServiceAccount token should NOT be auto-mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: etl
automountServiceAccountToken: false
