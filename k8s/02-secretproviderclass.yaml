# Requires the Azure Key Vault CSI driver addon enabled on the AKS cluster:
#   az aks enable-addons -a azure-keyvault-secrets-provider -g etl-rg -n etl-aks
#
# This mounts secrets from Key Vault as files inside the pod at
# /mnt/secrets-store, and (optionally) syncs them into a native
# Kubernetes Secret via secretObjects below.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: etl-kv-secrets
  namespace: etl
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "<MANAGED_IDENTITY_CLIENT_ID>"
    keyvaultName: "etl-kv"
    tenantId: "<AZURE_TENANT_ID>"
    objects: |
      array:
        - |
          objectName: storage-connection-string
          objectType: secret
        - |
          objectName: source-api-key
          objectType: secret
  secretObjects:
    - secretName: etl-secrets
      type: Opaque
      data:
        - objectName: storage-connection-string
          key: STORAGE_CONNECTION_STRING
        - objectName: source-api-key
          key: SOURCE_API_KEY
